<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calculator">
    <!-- Top-Left History/List Icon -->
    <div class="top-menu">☰</div>
    
    <div class="display">0</div>
    <div id="scientific-grid" class="buttons">
    <!-- Trig & Log -->
    <button class="sci-btn" onclick="calculateScientific('sin')">sin</button>
    <button class="sci-btn" onclick="calculateScientific('cos')">cos</button>
    <button class="sci-btn" onclick="calculateScientific('tan')">tan</button>
    <button class="sci-btn" onclick="calculateScientific('log')">log</button>
    
    <!-- Powers & Roots -->
    <button class="sci-btn" onclick="calculateScientific('square')">x²</button>
    <button class="sci-btn" onclick="calculateScientific('sqrt')">√</button>
    <button class="sci-btn" onclick="calculateScientific('pi')">π</button>
    <button class="sci-btn" onclick="calculateScientific('exp')">e</button>
</div>
    <div class="buttons">
        <button class="function-btn">AC</button><button class="function-btn">+/-</button><button class="function-btn">%</button><button class="operator">÷</button>
        <button>7</button><button>8</button><button>9</button><button class="operator">×</button>
        <button>4</button><button>5</button><button>6</button><button class="operator">-</button>
        <button>1</button><button>2</button><button>3</button><button class="operator">+</button>
        <!-- Bottom Row -->
        <button onclick="toggleScientific()">⌨</button>
        <button>0</button><button>.</button><button class="operator">=</button>
    </div>

    <!-- Scientific Panel (Initially Hidden) -->
    
<script src="javascript.js"></script>
</body>
</html>
